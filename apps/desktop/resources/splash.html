<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>HorunDrama</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; background: transparent; }
      body {
        display: grid;
        place-items: center;
        -webkit-app-region: drag;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 22px;
        display: grid;
        grid-template-rows: 1fr auto;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #1b1310 0%, #0a0908 62%, #080706 100%);
        border: 1px solid rgba(242, 234, 224, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      /* 一圈缓慢旋动的光晕，呼应图标里的刻度环 */
      .halo {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255, 77, 46, 0) 0deg, rgba(255, 77, 46, 0.55) 80deg, rgba(255, 77, 46, 0) 170deg);
        filter: blur(18px);
        animation: spin 2.4s linear infinite;
        opacity: 0.55;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .logo {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: linear-gradient(160deg, #ff5a3c, #c0271b);
        display: grid;
        place-items: center;
        box-shadow: 0 18px 44px -18px rgba(255, 77, 46, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.32);
        animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.2, 1) both;
      }
      @keyframes pop {
        0% { transform: scale(0.72); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .logo svg { width: 46px; height: 46px; }

      .bottom { position: relative; padding-bottom: 26px; text-align: center; }
      .name {
        font-size: 15px;
        letter-spacing: 0.3em;
        color: rgba(242, 234, 224, 0.92);
        text-transform: uppercase;
        animation: rise 0.8s 0.15s ease both;
      }
      .tick {
        margin: 10px auto 0;
        width: 96px;
        height: 2px;
        border-radius: 2px;
        background: rgba(242, 234, 224, 0.14);
        overflow: hidden;
      }
      .tick i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #ff4d2e, #e5b45c);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="halo"></div>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8.5 6.2l9 5.8-9 5.8z" fill="#fff" />
        </svg>
      </div>
      <div class="bottom">
        <div class="name">HorunDrama</div>
        <div class="tick"><i></i></div>
      </div>
    </div>
  </body>
</html>
